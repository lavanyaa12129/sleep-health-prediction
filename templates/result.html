<!DOCTYPE html>
<html>
<head>
    <title>Sleep Health Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="result-container">

    <h1>Sleep Health Result</h1>

    <div class="result-card">

        <h2>{{ prediction }}</h2>

        <h3>What does it mean?</h3>
        <p>{{ description }}</p>

        <h3>What can you do?</h3>
        <p>{{ solution }}</p>

    </div>

    <div class="disclaimer">
        This prediction is for educational purposes only and is not a medical
        diagnosis. Please consult a qualified healthcare professional for
        proper evaluation and treatment.
    </div>

    <a href="/" class="back-button">Check Again</a>

</div>

</body>
</html>
